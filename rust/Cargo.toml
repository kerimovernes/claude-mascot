[package]
name = "claude-mascot"
version = "0.7.0"
edition = "2021"
description = "Native Windows desktop mascot with a platform-independent Rust simulation"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
fontdue = "0.9"
sha2 = "0.10"
semver = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Media_Control", "Foundation_Collections", "Win32_System_Com", "Win32_System_Ole", "Win32_System_WinRT", "Win32_UI_Accessibility"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_Controls_Dialogs", "Win32_UI_Controls", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Networking_WinHttp", "Win32_Security"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
